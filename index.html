<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Cidades</title>
    <script>
        const url = "https://01c72ea2-dc83-4f76-b4e6-f998346028e2-00-1fmk7t8gu8uk4.picard.replit.dev";
        const urlCidades = "/cidades";

        function carregarDadosDoJSONServer() {
            fetch(urlCidades)
                .then(function(response) { return response.json(); })
                .then(function(dados) {
                    cidades = dados.cidades;
                    console.log('Dados carregados:');
                    console.log(cidades);
                    imprimirDadosDoBancoDeDados(cidades)
                })
        }

        function imprimirDadosDoBancoDeDados(cidades) {
            let txt = "";
            let tela = document.getElementById('tela')

            cidades.forEach((cidade) => {
                txt += `<p>
                            id: ${cidade.id} <br/>
                            cidade: <strong>${cidade.cidade}</strong> <br/>
                            estado: ${cidade.estado} <br/>
                            População: ${cidade.população}
                        </p> <br/>`
            })
            tela.innerHTML = txt;
        }
    </script>
</head>

<body>
    <button onclick="carregarDadosDoJSONServer()">Carregar Lista de Cidades</button>
    <div id="tela"></div>
</body>


</html>
